<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0d0d0d">
<title>S79 Teppanyaki · Đánh Giá Trải Nghiệm</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Be+Vietnam+Pro:wght@300;400;500;600&display=swap">

<style>
  /* ── Design tokens — S79 Japanese Teppanyaki palette ── */
  :root {
    --bg:        #0d0d0d;
    --bg2:       #161616;
    --bg3:       #1e1e1e;
    --border:    rgba(232,87,10,0.28);
    --gold:      #e8570a;
    --gold-lt:   #ff8040;
    --gold-dim:  rgba(232,87,10,0.15);
    --red:       #e8570a;
    --red-hover: #ff6820;
    --fg:        #f5f0eb;
    --fg-dim:    rgba(245,240,235,0.55);
    --star-off:  rgba(232,87,10,0.22);
    --star-on:   #ff8040;
    --radius:    14px;
    color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--fg);
    font-family: 'Be Vietnam Pro', system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    height: 100%;
    padding: 0 16px env(safe-area-inset-bottom, 12px);
    background-image:
      radial-gradient(ellipse 80% 40% at 50% 0%, rgba(232,87,10,0.12) 0%, transparent 65%),
      radial-gradient(ellipse 60% 30% at 30% 100%, rgba(180,30,0,0.08) 0%, transparent 60%),
      url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Ccircle cx='30' cy='30' r='28' stroke='%23e8570a' stroke-width='0.3' stroke-opacity='0.07'/%3E%3C/g%3E%3C/svg%3E");
  }

  /* ── Header ── */
  .header {
    width: 100%;
    max-width: 480px;
    text-align: center;
    padding: 10px 0 8px;
  }

  .kohaku-logo {
    display: flex;
    justify-content: center;
    margin-bottom: 4px;
  }

  .kohaku-logo-img {
    width: clamp(110px, 34vw, 160px);
    height: auto;
    filter: drop-shadow(0 4px 24px rgba(232,87,10,0.30))
            drop-shadow(0 2px 10px rgba(0,0,0,0.5));
    mix-blend-mode: screen;
    /* Logo PNG đã tách nền — hiển thị chìm trên nền tối */
  }

  .header h1 {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: clamp(18px, 4.5vw, 24px);
    font-weight: 700;
    color: var(--fg);
    line-height: 1.25;
    text-wrap: balance;
  }

  .header-sub {
    font-size: 13px;
    color: var(--fg-dim);
    margin-top: 6px;
  }

  /* ── Progress timeline ── */
  .progress {
    width: 100%;
    max-width: 480px;
    display: flex;
    align-items: center;
    margin-bottom: 10px;
    gap: 0;
  }

  .step {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    flex: 1;
    position: relative;
    cursor: default;
  }

  .step-dot {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 2px solid var(--border);
    background: var(--bg2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 600;
    color: var(--fg-dim);
    transition: all 0.35s ease;
    position: relative;
    z-index: 1;
  }

  .step.active .step-dot {
    border-color: var(--gold);
    background: var(--gold-dim);
    color: var(--gold-lt);
    box-shadow: 0 0 0 4px rgba(232,87,10,0.12);
  }

  .step.done .step-dot {
    border-color: var(--gold);
    background: var(--gold);
    color: #fff;
  }

  .step-done-icon { display: none; }
  .step.done .step-num { display: none; }
  .step.done .step-done-icon { display: block; }

  .step-label {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.05em;
    color: var(--fg-dim);
    text-align: center;
    white-space: nowrap;
    transition: color 0.3s;
  }

  .step.active .step-label { color: var(--gold); }
  .step.done .step-label { color: var(--gold-lt); }

  .step-line {
    flex: 1;
    height: 2px;
    background: var(--border);
    margin-bottom: 14px;
    transition: background 0.35s ease;
    position: relative;
  }

  .step-line.filled { background: var(--gold); }

  /* ── Card ── */
  .question-number { display: none; }

  .card {
    width: 100%;
    max-width: 480px;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 18px 18px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 0 1px rgba(232,87,10,0.07);
  }

  /* ── Question ── */
  .question-number {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 10px;
  }

  .question-text {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: clamp(15px, 3.8vw, 18px);
    font-weight: 600;
    color: var(--fg);
    line-height: 1.4;
    text-wrap: balance;
    text-align: center;
    margin-bottom: 16px;
  }

  /* ── Star rating ── */
  .stars-label {
    font-size: 12px;
    font-weight: 500;
    color: var(--fg-dim);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    text-align: center;
    margin-bottom: 8px;
  }

  .stars {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 10px;
  }

  .star {
    cursor: pointer;
    font-size: 38px;
    color: var(--star-off);
    transition: color 0.15s, transform 0.15s;
    line-height: 1;
    user-select: none;
    -webkit-user-select: none;
  }

  .star.hovered,
  .star.selected {
    color: var(--star-on);
  }

  @media (hover: hover) and (pointer: fine) {
    .star:hover { color: var(--star-on); transform: scale(1.18); }
  }

  .star.selected { transform: scale(1.08); }

  .star-desc {
    font-size: 12px;
    color: var(--gold-lt);
    min-height: 18px;
    margin-bottom: 10px;
    font-weight: 500;
    text-align: center;
    transition: opacity 0.2s;
  }

  /* ── Comment box ── */
  .comment-label {
    font-size: 12px;
    font-weight: 500;
    color: var(--fg-dim);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  textarea {
    width: 100%;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--fg);
    font-family: 'Be Vietnam Pro', system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.6;
    padding: 10px 14px;
    resize: none;
    min-height: 72px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  textarea::placeholder { color: var(--fg-dim); opacity: 0.6; }

  textarea:focus {
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(232,87,10,0.14);
  }

  /* ── Buttons ── */
  .actions {
    display: flex;
    gap: 12px;
    margin-top: 14px;
    justify-content: space-between;
  }

  .btn {
    flex: 1;
    padding: 12px 20px;
    border: none;
    border-radius: 10px;
    font-family: 'Be Vietnam Pro', system-ui, sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.04em;
  }

  .btn-back {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--fg-dim);
    flex: 0 0 auto;
    min-width: 90px;
  }

  .btn-back:hover {
    border-color: var(--gold);
    color: var(--gold);
  }

  .btn-next {
    background: linear-gradient(135deg, #e8570a 0%, #c83000 100%);
    color: #fff;
    letter-spacing: 0.06em;
  }

  .btn-next:hover { background: linear-gradient(135deg, #ff6820 0%, #e04010 100%); transform: translateY(-1px); box-shadow: 0 6px 20px rgba(232,87,10,0.4); }
  .btn-next:active { transform: translateY(0); }

  .btn-next:disabled {
    background: rgba(232,87,10,0.3);
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
  }

  /* ── Thank you screen ── */
  .thankyou {
    text-align: center;
    padding: 12px 0 8px;
  }

  .thankyou-icon {
    font-size: 56px;
    margin-bottom: 16px;
    display: block;
  }

  .thankyou h2 {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 26px;
    font-weight: 700;
    color: var(--fg);
    margin-bottom: 10px;
  }

  .thankyou p {
    color: var(--fg-dim);
    font-size: 14px;
    line-height: 1.7;
    max-width: 320px;
    margin: 0 auto 20px;
  }

  .thankyou-divider {
    width: 60px;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin: 20px auto;
  }

  .thankyou-brand {
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--gold-lt);
    font-weight: 600;
  }

  /* ── Transition animation ── */
  @keyframes slideIn {
    from { opacity: 0; transform: translateX(30px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  @keyframes slideInLeft {
    from { opacity: 0; transform: translateX(-30px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  .card.entering { animation: slideIn 0.3s ease forwards; }
  .card.entering-back { animation: slideInLeft 0.3s ease forwards; }

  @keyframes popIn {
    0%   { transform: scale(0.6); opacity: 0; }
    70%  { transform: scale(1.12); }
    100% { transform: scale(1); opacity: 1; }
  }

  .thankyou-icon { animation: popIn 0.5s 0.1s ease both; }

  /* ── Decorative orange line ── */
  .gold-line {
    width: 100%;
    max-width: 480px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin-bottom: 20px;
    opacity: 0.4;
  }
</style>
</head>

      <span class="step-done-icon">✓</span>
    </div>
    <span class="step-label">Phục vụ</span>
  </div>
</div>

<!-- Card -->
<div class="card" id="card">
  <p class="question-text" id="q-text">Quý khách đánh giá chất lượng món ăn hôm nay như thế nào?</p>

  <div class="stars-label">Mức độ hài lòng</div>
  <div class="stars" id="stars" role="group" aria-label="Chọn số sao">
    <span class="star" data-val="1" role="button" tabindex="0" aria-label="1 sao">★</span>
    <span class="star" data-val="2" role="button" tabindex="0" aria-label="2 sao">★</span>
    <span class="star" data-val="3" role="button" tabindex="0" aria-label="3 sao">★</span>
    <span class="star" data-val="4" role="button" tabindex="0" aria-label="4 sao">★</span>
    <span class="star" data-val="5" role="button" tabindex="0" aria-label="5 sao">★</span>
  </div>
  <div class="star-desc" id="star-desc"></div>

  <div class="comment-label">Chia sẻ thêm (không bắt buộc)</div>
  <textarea id="comment" placeholder="Nhập cảm nhận của quý khách…" maxlength="500"></textarea>

  <div class="actions">
    <button class="btn btn-back" id="btn-back" style="display:none">← Quay lại</button>
    <button class="btn btn-next" id="btn-next" disabled>Tiếp theo →</button>
  </div>
</div>

<script>
  const questions = [
    "Quý khách đánh giá chất lượng món ăn hôm nay như thế nào?",
    "Quý khách đánh giá bữa ăn hôm nay tại nhà hàng như thế nào?",
    "Quý khách đánh giá chất lượng phục vụ của nhân viên như thế nào?"
  ];

  const starLabels = ["", "Rất không hài lòng", "Không hài lòng", "Bình thường", "Hài lòng", "Rất hài lòng ✦"];

  // State
  let current = 0;
  const answers = [
    { rating: 0, comment: "" },
    { rating: 0, comment: "" },
    { rating: 0, comment: "" }
  ];

  // DOM refs
  const card     = document.getElementById('card');
  const qNum     = document.getElementById('q-number');
  const qText    = document.getElementById('q-text');
  const stars    = document.querySelectorAll('.star');
  const starDesc = document.getElementById('star-desc');
  const comment  = document.getElementById('comment');
  const btnBack  = document.getElementById('btn-back');
  const btnNext  = document.getElementById('btn-next');
  const steps    = document.querySelectorAll('.step');
  const line1    = document.getElementById('line1');
  const line2    = document.getElementById('line2');

  function updateStars(selected, hovered) {
    stars.forEach((s, i) => {
      s.classList.toggle('selected', i < selected);
      s.classList.toggle('hovered', hovered > 0 && i < hovered && i >= selected);
    });
  }

  function renderQuestion(dir = 'next') {
    // Animate card
    card.className = 'card ' + (dir === 'next' ? 'entering' : 'entering-back');
    void card.offsetWidth;

    // Content
    if (qNum) qNum.textContent = `Câu hỏi ${current + 1} / ${questions.length}`;
    qText.textContent = questions[current];
    comment.value     = answers[current].comment;
    const r = answers[current].rating;
    updateStars(r, 0);
    starDesc.textContent = starLabels[r] || '';
    btnBack.style.display = current > 0 ? '' : 'none';
    btnNext.textContent   = current === questions.length - 1 ? 'Gửi đánh giá ✦' : 'Tiếp theo →';
    btnNext.disabled      = r === 0;

    // Progress
    steps.forEach((s, i) => {
      s.classList.remove('active', 'done');
      if (i < current)  s.classList.add('done');
      if (i === current) s.classList.add('active');
    });
    line1.classList.toggle('filled', current >= 1);
    line2.classList.toggle('filled', current >= 2);
  }

  // Star interactions
  const starsEl   = document.getElementById('stars');
  const isMouse   = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
  let touchActive = false;

  function selectStar(val) {
    answers[current].rating = val;
    updateStars(val, 0);
    starDesc.textContent = starLabels[val];
    btnNext.disabled = false;
  }

  // ── TOUCH: handle trên container, tính sao theo tọa độ X ──
  // Cách này đáng tin cậy hơn bind từng span vì không bị miss touch target
  function starFromTouch(touch) {
    const rect = starsEl.getBoundingClientRect();
    const x    = touch.clientX - rect.left;
    const val  = Math.min(5, Math.max(1, Math.ceil(x / (rect.width / 5))));
    return val;
  }

  starsEl.addEventListener('touchstart', (e) => {
    touchActive = true;
    selectStar(starFromTouch(e.touches[0]));
    // Cho phép swipe để thay đổi sao
  }, { passive: true });

  starsEl.addEventListener('touchmove', (e) => {
    if (!touchActive) return;
    const val = starFromTouch(e.touches[0]);
    // Preview khi kéo ngón tay
    updateStars(answers[current].rating, val);
  }, { passive: true });

  starsEl.addEventListener('touchend', (e) => {
    if (!touchActive) return;
    touchActive = false;
    // Ghi nhận sao cuối cùng khi nhấc ngón tay
    if (e.changedTouches[0]) {
      selectStar(starFromTouch(e.changedTouches[0]));
    }
  }, { passive: true });

  // ── MOUSE (desktop): hover + click trên từng sao ──
  if (isMouse) {
    stars.forEach((star) => {
      const val = +star.dataset.val;
      star.addEventListener('mouseenter', () => {
        updateStars(answers[current].rating, val);
        starDesc.textContent = starLabels[val];
      });
      star.addEventListener('mouseleave', () => {
        updateStars(answers[current].rating, 0);
        starDesc.textContent = starLabels[answers[current].rating] || '';
      });
      star.addEventListener('click', () => selectStar(val));
    });
  }

  // ── Keyboard ──
  stars.forEach((star) => {
    star.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') selectStar(+star.dataset.val);
    });
  });

  comment.addEventListener('input', () => {
    answers[current].comment = comment.value;
  });

  function goNext() {
    answers[current].comment = comment.value;
    if (current < questions.length - 1) {
      current++;
      renderQuestion('next');
    } else {
      showThankYou();
    }
  }

  function goBack() {
    answers[current].comment = comment.value;
    current--;
    renderQuestion('back');
  }

  function showThankYou() {
    // Mark all done
    steps.forEach(s => { s.classList.remove('active'); s.classList.add('done'); });
    line1.classList.add('filled');
    line2.classList.add('filled');

    card.className = 'card entering';
    card.innerHTML = `
      <div class="thankyou">
        <span class="thankyou-icon">🌸</span>
        <h2>Cảm ơn quý khách!</h2>
        <div class="thankyou-divider"></div>
        <p>Phản hồi của quý khách rất có giá trị với chúng tôi. Chúng tôi sẽ không ngừng nỗ lực để mang đến trải nghiệm ẩm thực tuyệt vời nhất.</p>
        <div class="thankyou-brand">S79 Japanese Teppanyaki · SOL Group</div>
      </div>
    `;
  }

  // ── Button events (addEventListener thay vì onclick để tương thích file:// trên Safari) ──
  btnNext.addEventListener('click', goNext);
  btnBack.addEventListener('click', goBack);

  // Init
  renderQuestion('next');
</script>

</body>
</html>
